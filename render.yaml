# Render Blueprint. Two Docker web services from the same Dockerfile; each runs the site, the API and the
# 15-minute cron in-process. Prod deploys come from .github/workflows/ci.yml after the tests pass, so its
# auto-deploy is off. Dev deploys itself from the dev branch once GitHub checks pass.
services:
  - type: web
    name: evincus
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: prod
    # Paid on purpose: free instances can't hold a disk and sleep when idle, which stops the cron.
    plan: 0.5c-512mb
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    # Render issues TLS and adds www.evincus.shop as a redirect to the root.
    domains:
      - evincus.shop
    # Orders, subscribers, sales, rate limits, the catalog, stock and its photos. Snapshotted daily by Render.
    disk:
      name: kv
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KV_PATH
        value: /var/data/kv.sqlite3
      - key: MEDIA_PATH
        value: /var/data/media
      - key: ENVIRONMENT
        value: production
      - key: CSP_MODE
        value: report-only
      - key: NEWSLETTER_HOUR
        value: "10"
      - key: EMAIL_FROM
        value: "Evincus <no-reply@evincus.shop>"
      # Email links and images. The API is same-origin, so no ALLOWED_ORIGINS.
      - key: SITE_URL
        value: https://evincus.shop
      - key: API_URL
        value: https://evincus.shop
      # live | maintenance | stocking. Anything but live shows a 503 page on evincus.shop; onrender.com always shows the store.
      - key: STATUS
        value: stocking
      # Asked for once when the Blueprint is created.
      - key: OWNER_EMAIL
        sync: false
      - key: POSTAL_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEWSLETTER_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # 32 random bytes, base64. Keep a copy in a password manager: losing it loses every stored customer detail.
      - key: CUSTOMER_DATA_KEY
        sync: false
      # Payments stay off until both WiPay values are set. Production refuses sandbox settings or the test key.
      - key: WIPAY_ENVIRONMENT
        value: live
      - key: WIPAY_ACCOUNT_NUMBER
        sync: false
      - key: WIPAY_API_KEY
        sync: false

  - type: web
    name: evincus-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: dev
    # Free: no disk, so KV and photos in /tmp reset on each deploy and are seeded again from data/eras.
    # KEEPALIVE_URL stops the idle sleep.
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: KV_PATH
        value: /tmp/kv.sqlite3
      - key: MEDIA_PATH
        value: /tmp/media
      # Each seeded variant starts with 10 on hand, so the dev store can be bought from. Prod seeds 0.
      - key: SEED_STOCK
        value: "10"
      - key: ENVIRONMENT
        value: staging
      - key: CSP_MODE
        value: enforce
      - key: EMAIL_DISABLED
        value: "true"
      - key: EMAIL_FROM
        value: "Evincus <no-reply@evincus.shop>"
      # evincus.shop is served by this service too. live | maintenance | stocking: anything but live shows a 503 page
      # on evincus.shop, while evincus-dev.onrender.com (the dev link) always shows the store.
      - key: STATUS
        value: stocking
      # NEWSLETTER_HOUR unset keeps the newsletter cron off on dev.
      # Asked for once when the Blueprint is created; values in the gitignored .env.render-dev.
      # SITE_URL, API_URL and KEEPALIVE_URL are the service's onrender.com URL (KEEPALIVE_URL + /api/health).
      - key: SITE_URL
        sync: false
      - key: API_URL
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      # Test inbox: dev must never email the real owner mailbox or subscribers.
      - key: OWNER_EMAIL
        sync: false
      - key: POSTAL_ADDRESS
        sync: false
      # Fresh secrets, never prod's.
      - key: RESEND_API_KEY
        sync: false
      - key: NEWSLETTER_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # A different key from prod's.
      - key: CUSTOMER_DATA_KEY
        sync: false
      # WiPay's public sandbox: test cards only. WIPAY_API_KEY is the sandbox key 123.
      - key: WIPAY_ENVIRONMENT
        value: sandbox
      - key: WIPAY_ACCOUNT_NUMBER
        value: "1234567890"
      - key: WIPAY_API_KEY
        sync: false
