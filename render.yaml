# Render Blueprint. Two Docker web services from the same Dockerfile; each runs the site, the API and the
# 15-minute cron in-process. Prod deploys come from .github/workflows/ci.yml after the tests pass, so its
# auto-deploy is off. Dev deploys itself from the dev branch once GitHub checks pass.
services:
  - type: web
    name: evincus
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: prod
    # Paid on purpose: free instances can't hold a disk and sleep when idle, which stops the cron.
    plan: 0.5c-512mb
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    # Render issues TLS and adds www.evincus.shop as a redirect to the root.
    domains:
      - evincus.shop
    # Orders, subscribers, sales and rate limits. Snapshotted daily by Render.
    disk:
      name: kv
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KV_PATH
        value: /var/data/kv.sqlite3
      - key: ENVIRONMENT
        value: production
      - key: PAYMENT_MODE
        value: none
      - key: CSP_MODE
        value: report-only
      - key: SHIPPING_USD
        value: "0"
      - key: NEWSLETTER_HOUR
        value: "10"
      - key: EMAIL_FROM
        value: "Evincus <no-reply@evincus.shop>"
      # Email links and images. The API is same-origin, so no ALLOWED_ORIGINS.
      - key: SITE_URL
        value: https://evincus.shop
      - key: API_URL
        value: https://evincus.shop
      # Asked for once when the Blueprint is created.
      - key: DELIVERY_EXCLUDED_COUNTRIES
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: POSTAL_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_HMAC_KEY
        sync: false
      - key: NEWSLETTER_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: evincus-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: dev
    # Free: no disk, so KV in /tmp resets on each deploy. KEEPALIVE_URL stops the idle sleep.
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: KV_PATH
        value: /tmp/kv.sqlite3
      - key: ENVIRONMENT
        value: staging
      # Exercise the same no-payment flow as production.
      - key: PAYMENT_MODE
        value: none
      - key: CSP_MODE
        value: enforce
      - key: EMAIL_DISABLED
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: SHIPPING_USD
        value: "0"
      - key: EMAIL_FROM
        value: "Evincus <no-reply@evincus.shop>"
      # NEWSLETTER_HOUR unset keeps the newsletter cron off on dev.
      # Asked for once when the Blueprint is created; values in the gitignored .env.render-dev.
      # SITE_URL, API_URL and KEEPALIVE_URL are the service's onrender.com URL (KEEPALIVE_URL + /api/health).
      - key: SITE_URL
        sync: false
      - key: API_URL
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: DELIVERY_EXCLUDED_COUNTRIES
        sync: false
      # Test inbox: dev must never email the real owner mailbox or subscribers.
      - key: OWNER_EMAIL
        sync: false
      - key: POSTAL_ADDRESS
        sync: false
      # Fresh secrets, never prod's.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_HMAC_KEY
        sync: false
      - key: NEWSLETTER_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
