# Tests every push and PR. A push to prod that passes is deployed to Render, then checked live.
# Needs the RENDER_DEPLOY_HOOK_URL secret. Set the RENDER_URL variable (https://evincus.onrender.com) only while
# evincus.shop's DNS doesn't point at Render yet.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:security
      - run: npm audit --audit-level=high
      - run: node --test
      - run: npm run check:performance
      - run: npm run check:load
      - run: npm run check:restore
      - name: Verify unprivileged container and excluded files
        run: |
          docker build -t evincus:check .
          test "$(docker inspect --format '{{.Config.User}}' evincus:check)" = node
          docker run --rm --entrypoint sh evincus:check -c 'test ! -e /app/.env && test ! -d /app/.git && test ! -e /app/.kv.sqlite3 && test ! -d /app/.verification && touch /var/data/permission-check && rm /var/data/permission-check'
      - name: Scan production container dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: evincus:check
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push to prod replaces a waiting one.
    concurrency:
      group: render-production
      cancel-in-progress: true
    env:
      SITE: ${{ vars.RENDER_URL || 'https://evincus.shop' }}
    steps:
      - name: Deploy this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA"

      # /api/health checks the catalog and KV and reports the running commit.
      - name: Wait until this commit is live and healthy
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "$SITE/api/health") && echo "$body" | grep -q '"ok":true' \
              && echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA:0:7}" && exit 0
            sleep 15
          done
          echo "::error::$GITHUB_SHA not live and healthy after 15 minutes"
          exit 1

      - name: Smoke-test pages, assets and API
        run: |
          for path in / /eras.html /policies.html /newsletter.html /assets/css/index.css /assets/js/index.js \
            /assets/js/config.js /data/site.json /api/eras /api/checkout/options; do
            curl -fsS -o /dev/null "$SITE$path" || { echo "::error::$path failed"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-such-page.html")
          [ "$code" = 404 ] || { echo "::error::missing page returned $code, not 404"; exit 1; }
          for path in /.env /.git/config /server/index.js /.kv.sqlite3 /__error/503; do
            code=$(curl --max-time 15 -s -o /dev/null -w '%{http_code}' "$SITE$path")
            [ "$code" = 404 ] || { echo "::error::$path is exposed ($code)"; exit 1; }
          done
          headers=$(curl --max-time 15 -fsSI "$SITE/")
          echo "$headers" | grep -qi 'x-content-type-options: nosniff'
          echo "$headers" | grep -qi 'x-frame-options: DENY'
          echo "$headers" | grep -qi 'referrer-policy: no-referrer'
          echo "$headers" | grep -qi 'content-security-policy'
