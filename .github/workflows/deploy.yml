name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy the API
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config worker/wrangler.toml
            ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && '--env staging' || '' }}
            --var COMMIT_SHA:${{ github.sha }}

  deploy-pages:
    needs: deploy-worker
    if: github.event_name == 'push' || inputs.target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write public site config
        run: |
          cat > assets/js/config.js <<EOF
          export const PAYPAL_CLIENT_ID = '${{ vars.PAYPAL_CLIENT_ID }}';
          export const API_BASE = '${{ vars.API_BASE }}';
          EOF
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r assets pages data _site/
          cp *.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
