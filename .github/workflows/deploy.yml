# Note: CLOUDFLARE_API_TOKEN should be scoped to "Workers Scripts: Edit" (plus "Workers KV Storage: Edit" if needed) on this account only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy the API
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config worker/wrangler.toml
            ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && '--env staging' || '' }}
            --var COMMIT_SHA:${{ github.sha }}

  deploy-pages:
    needs: deploy-worker
    if: github.event_name == 'push' || inputs.target == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write public site config
        run: |
          cat > assets/js/config.js <<EOF
          export const PAYPAL_CLIENT_ID = '${{ vars.PAYPAL_CLIENT_ID }}';
          export const API_BASE = '${{ vars.API_BASE }}';
          EOF
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r assets pages data _site/
          cp *.html _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
