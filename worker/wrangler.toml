name = "evincus-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
PAYMENT_MODE = "none"
DELIVERY_EXCLUDED_COUNTRIES = ""
SHIPPING_USD = "0"
OWNER_EMAIL = "REPLACE_WITH_OWNER_EMAIL"
EMAIL_FROM = "Evincus <orders@evincus.shop>"
ALLOWED_ORIGINS = "https://evincus.shop,https://www.evincus.shop,https://jojo6550.github.io"
COMMIT_SHA = "dev"

[observability]
enabled = true

# Replace with the id from: npx wrangler kv namespace create ORDERS
[[kv_namespaces]]
binding = "ORDERS"
id = "local-orders"

[triggers]
crons = ["*/15 * * * *"]

[[durable_objects.bindings]]
name = "ORDER_SUBMISSIONS"
class_name = "OrderSubmission"

[[migrations]]
tag = "v1-order-submissions"
new_sqlite_classes = ["OrderSubmission"]

[[ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "1003"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "BEACON_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[env.staging]
name = "evincus-api-staging"
routes = []

[env.staging.vars]
ENVIRONMENT = "staging"
PAYMENT_MODE = "none"
DELIVERY_EXCLUDED_COUNTRIES = ""
SHIPPING_USD = "0"
OWNER_EMAIL = "REPLACE_WITH_OWNER_EMAIL"
EMAIL_FROM = "Evincus <orders@evincus.shop>"
ALLOWED_ORIGINS = "https://jojo6550.github.io"
COMMIT_SHA = "dev"

[[env.staging.durable_objects.bindings]]
name = "ORDER_SUBMISSIONS"
class_name = "OrderSubmission"

[env.staging.triggers]
crons = ["*/15 * * * *"]

[[env.staging.ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "1004"
[env.staging.ratelimits.simple]
limit = 5
period = 60

[[env.staging.kv_namespaces]]
binding = "ORDERS"
id = "REPLACE_WITH_ORDERS_STAGING_KV_ID"

[[env.staging.ratelimits]]
name = "BEACON_LIMIT"
namespace_id = "1002"

  [env.staging.ratelimits.simple]
  limit = 10
  period = 60
