<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <title>Evincus | Streetwear for the bold</title>
  <meta name="description" content="Evincus is neo-gen alternative streetwear from Jamaica. Shop the Catastrophe Collection: heavyweight tees, fleece, and track sets.">
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Evincus">
  <meta property="og:title"       content="Evincus | Catastrophe Collection out now">
  <meta property="og:description" content="Neo-gen alternative streetwear from Jamaica. Streetwear for the bold, with effortless comfort and style.">
  <meta property="og:image"       content="https://evincus.shop/cdn/shop/files/IMG_0559.jpg?v=1771262379&width=1200">
  <meta property="og:locale"      content="en_JM">
  <meta name="twitter:card"       content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.shopify.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip" href="#app">Skip to content</a>

<header id="nav">
  <div class="wrap nav-inner">
    <a href="#/" class="wordmark" aria-label="Evincus home">Evincus</a>
    <nav aria-label="Main">
      <ul class="nav-links" role="list">
        <li><a href="#/shop"  data-nav>Shop</a></li>
        <li><a href="#/about" data-nav>About</a></li>
        <li>
          <button type="button" class="bag-btn" id="bagOpen" aria-haspopup="dialog" aria-controls="bag">
            Bag <span class="bag-count" id="bagCount">0</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <div class="wordmark wordmark-lg">Evincus</div>
      <p class="footer-line">Neo-gen alternative streetwear from Jamaica. Be you.</p>
    </div>
    <ul class="footer-links" role="list">
      <li><a href="#/shop">Shop all</a></li>
      <li><a href="#/about">About</a></li>
      <li><a href="#/checkout">Checkout</a></li>
    </ul>
    <ul class="footer-links" role="list">
      <li><a href="https://www.instagram.com/evincus.sw/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a href="https://www.tiktok.com/@_evincus_" target="_blank" rel="noopener noreferrer">TikTok</a></li>
    </ul>
  </div>
  <div class="wrap footer-base">
    <span>© 2026 Evincus</span>
    <span>Payments secured by PayPal</span>
  </div>
</footer>

<!-- Bag drawer -->
<div class="scrim" id="scrim" hidden></div>
<aside class="bag" id="bag" role="dialog" aria-modal="true" aria-labelledby="bagTitle" aria-hidden="true">
  <div class="bag-head">
    <h2 id="bagTitle">Your bag</h2>
    <button type="button" class="icon-btn" id="bagClose" aria-label="Close bag">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="bag-body" id="bagBody"></div>
  <div class="bag-foot" id="bagFoot"></div>
</aside>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
